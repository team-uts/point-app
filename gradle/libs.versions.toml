[versions]
java = "21"
kotlin = "2.3.21"

spring-boot = "4.1.0"
spring-dependency-management = "1.1.7"

querydsl = "5.1.0"
mapstruct = "1.6.3"
flywaydb = "13.2.0"

spotless = "8.10.3"
ktlint = "1.8.0"

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependencyManagement = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }

kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
kotlin-jpa = { id = "org.jetbrains.kotlin.plugin.jpa", version.ref = "kotlin" } # noarg, allOpen
kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }

flyway = { id = "org.flywaydb.flyway", version.ref = "flywaydb" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }

[libraries]
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect" }
kotlin-logging = { module = "io.github.oshai:kotlin-logging-jvm", version = "8.0.4" }

spring-tx = { module = "org.springframework:spring-tx" }

spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-boot-starter-webmvc-test = { module = "org.springframework.boot:spring-boot-starter-webmvc-test" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-data-jpa-test = { module = "org.springframework.boot:spring-boot-starter-data-jpa-test" }

spring-boot-h2console = { module = "org.springframework.boot:spring-boot-h2console" }

database-mysql = { module = "com.mysql:mysql-connector-j" }
database-h2 = { module = "com.h2database:h2" }

flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flywaydb" }
flyway-mysql = { module = "org.flywaydb:flyway-mysql", version.ref = "flywaydb" }

mapstruct-core = { module = "org.mapstruct:mapstruct", version.ref = "mapstruct" }
mapstruct-processor = { module = "org.mapstruct:mapstruct-processor", version.ref = "mapstruct" }

querydsl-jpa = { module = "com.querydsl:querydsl-jpa", version.ref = "querydsl" }
querydsl-apt = { module = "com.querydsl:querydsl-apt", version.ref = "querydsl" }

springdoc-openapi-webmvc = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version = "3.2.0" }

easyRandom = { module = "org.jeasy:easy-random", version = "6.0.1" }

google-gson = { module = "com.google.code.gson:gson" }

mockito = { module = "org.mockito:mockito-core", version = "5.23.0" }
